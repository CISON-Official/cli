[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cison"
version = "1.1.2"
description = "CISON CLI Program"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cloudflare>=5.6.0",
    "diskcache>=5.6.3",
    "ipython>=9.15.0",
    "jinja2>=3.1.6",
    "pandas>=3.0.3",
    "pika>=1.4.1",
    "py-localtunnel>=1.0.3",
    "python-decouple>=3.8",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "ruff>=0.16.3",
    "tqdm>=4.68.4",
    "typer>=0.26.7",
]

[project.scripts]
cison = "src.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]
