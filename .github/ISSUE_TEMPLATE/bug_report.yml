name: "Bug Report"
description: "File a bug report for CISON CLI"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run command 'cison user partial-payments'
        2. Enter parameter '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Console Output / Traceback
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: CLI Version
      placeholder: "e.g., 1.1.0"
    validations:
      required: true