name: "Feature Request"
description: "Suggest an idea or enhancement for CISON CLI"
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: Explain what problem this feature solves or what command should be added.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Implementation
      description: Describe how you envision this command or interface working.